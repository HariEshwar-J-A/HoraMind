name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    # A real Postgres rather than a mock: the schema uses plpgsql triggers,
    # partial unique indexes and functions, none of which a fake would execute.
    # Migrations that only ever run in production are migrations nobody tested.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: horamind
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: horamind_test
        options: >-
          --health-cmd "pg_isready -U horamind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Applies every migration to an empty database, then applies them again.
      # The second run must be a no-op — that is what proves the runner's
      # bookkeeping works and that migrations are not silently re-executed.
      - name: Migrations apply cleanly and are idempotent
        env:
          DATABASE_URL: postgres://horamind:ci@localhost:5432/horamind_test
        run: |
          node db/migrate.mjs
          node db/migrate.mjs --status
          node db/migrate.mjs | tee second-run.txt
          grep -q "up to date" second-run.txt

      - name: Test
        env:
          DATABASE_URL: postgres://horamind:ci@localhost:5432/horamind_test
          JWT_SECRET: ci-only-secret-not-used-anywhere-real-0000
        run: npm test

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build
    # Images are only worth publishing from the default branch; PRs just prove
    # the Dockerfile still builds.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/horamind-api:latest
            ghcr.io/${{ github.repository_owner }}/horamind-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

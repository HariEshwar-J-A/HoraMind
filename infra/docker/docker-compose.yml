# HoraMind — single-box deployment.
#
# Sized for a home PC: three small services, hard memory ceilings, no
# orchestrator. The same images run unchanged on k3s (see infra/k8s), so moving
# off this box later is a deployment change, not a rewrite.
#
#   docker compose -f infra/docker/docker-compose.yml up -d
#
# Requires a .env file at the repository root — see .env.example.

name: horamind

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-horamind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-horamind}
      # C collation is faster and, since the app never relies on locale-aware
      # sorting, costs nothing here.
      POSTGRES_INITDB_ARGS: "--data-checksums --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    # Not published to the host by default: the database is reachable only from
    # the compose network. Uncomment to connect a local client.
    # ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-horamind} -d ${POSTGRES_DB:-horamind}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [internal]

  chroma:
    image: chromadb/chroma:0.5.23
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      # The corpus built by JyotishBase. Mounted rather than baked into the
      # image so re-ingesting a new book does not require an image rebuild.
      - ${JYOTISHBASE_CHROMA_PATH:-../../../JyotishBase/chroma_data}:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    networks: [internal]

  # One-shot: applies pending migrations, then exits. The API waits for it to
  # complete successfully, so a container can never serve against a schema older
  # than its code.
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: "no"
    command: ["node", "db/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-horamind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-horamind}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: "true"
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DATABASE_URL: postgres://${POSTGRES_USER:-horamind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-horamind}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CHROMA_URL: http://chroma:8000
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-santhanam_source_of_truth}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID_IOS: ${GOOGLE_CLIENT_ID_IOS:-}
      GOOGLE_CLIENT_ID_ANDROID: ${GOOGLE_CLIENT_ID_ANDROID:-}
      GOOGLE_CLIENT_ID_WEB: ${GOOGLE_CLIENT_ID_WEB:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: 768M
    networks: [internal]

  # Internal router. Puts the API and the client on one origin so the browser
  # sees no cross-site request and the refresh cookie can be SameSite=Strict.
  # Plain HTTP: TLS is Cloudflare's job at the edge.
  caddy:
    image: caddy:2-alpine
    profiles: [tunnel, edge]
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WEB_DIST_PATH:-./web-placeholder}:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [internal]

  # Cloudflare Tunnel.
  #
  # This machine already runs a tunnel for another application, so this is a
  # SECOND, independent one: its own UUID, its own credentials, its own config.
  # `--config` is passed explicitly on every invocation — without it cloudflared
  # falls back to ~/.cloudflared/config.yml, which is very likely the other
  # app's, and would hand this app's ingress rules to that tunnel.
  #
  # Run ./infra/scripts/tunnel-preflight.sh before first use.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml --no-autoupdate run
    environment:
      # The tunnel UUID and hostname live in config.yml as literals, because
      # cloudflared does not expand ${VAR} in its configuration file.
      TUNNEL_METRICS: 0.0.0.0:2000
    volumes:
      # Read-only, and scoped to this tunnel's own directory. Nothing here can
      # reach the other tunnel's credentials or configuration.
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/creds.json:/etc/cloudflared/creds.json:ro
    depends_on: [caddy]
    # Outbound only. No ports are published, no router configuration changes,
    # and the home IP address is never in public DNS.
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge

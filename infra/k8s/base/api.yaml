# Migrations, then the API.
#
# The Job runs to completion before the Deployment is allowed to serve, so a pod
# can never answer requests against a schema older than its code. Argo CD and
# Flux both honour the sync-wave annotation; with plain kubectl, apply the Job
# and wait for it before applying the rest.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: horamind
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  # Cleaned up an hour after finishing, so a failed run stays inspectable but
  # old successes do not accumulate.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: migrate
        needs-postgres: "true"
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/harieshwar-j-a/horamind-api:latest
          command: ["node", "db/migrate.mjs"]
          envFrom:
            - configMapRef: { name: horamind-config }
            - secretRef:    { name: horamind-secrets }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: horamind-secrets, key: DATABASE_URL } }
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits:   { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: horamind
  labels: { app: api }
spec:
  selector: { app: api }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: horamind
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: api }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api
        needs-postgres: "true"
    spec:
      # The API drains in-flight requests on SIGTERM and the handler allows up
      # to 15 seconds, so the grace period has to exceed it or Kubernetes kills
      # the process mid-drain and the deploy drops requests.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/harieshwar-j-a/horamind-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: horamind-config }
            - secretRef:    { name: horamind-secrets }
          # Liveness never touches the database. If it did, a brief Postgres
          # blip would restart every healthy pod and turn a recoverable
          # incident into an outage.
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          # Readiness does check dependencies, so a pod that cannot serve is
          # removed from the Service without being killed.
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # The ephemeris kernel is 32 MB read from disk at boot, and the
          # embedding model loads on first retrieval. Startup is genuinely slow,
          # and without this probe the liveness check would kill the pod before
          # it ever became ready.
          startupProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: { memory: 384Mi, cpu: 100m }
            limits:   { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            # Required because the root filesystem is read-only; the WASM
            # runtime and Node both write scratch files.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Scale on memory as well as CPU: the ephemeris and the embedding model make
# this service memory-bound long before it is CPU-bound.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: horamind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
  behavior:
    scaleDown:
      # Slow to scale down. Startup costs 30+ seconds, so shedding a pod during
      # a lull only to pay for it again minutes later is a bad trade.
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: horamind
spec:
  # Keeps a node drain from taking the API to zero when more than one replica
  # is running. Harmless at one replica, correct at more.
  minAvailable: 1
  selector:
    matchLabels: { app: api }

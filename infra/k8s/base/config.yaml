# Non-secret configuration.
#
# Anything here is readable by anyone with cluster access, so the split from
# Secrets is meaningful rather than ceremonial: connection strings, keys and
# passwords live in horamind-secrets and never appear in this file or in git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: horamind-config
  namespace: horamind
data:
  NODE_ENV: "production"
  PORT: "8080"
  HOST: "0.0.0.0"
  LOG_LEVEL: "info"

  # True because Caddy and cloudflared both sit in front. If it were false,
  # every client IP would read as the proxy's and all users would share one
  # rate-limit bucket.
  TRUST_PROXY: "true"

  PUBLIC_BASE_URL: "https://astrology.harieshwar.dev"
  CORS_ORIGIN: "https://astrology.harieshwar.dev"

  CHROMA_URL: "http://chroma:8000"
  CHROMA_COLLECTION: "santhanam_source_of_truth"

  OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
  OPENROUTER_MODEL_FREE: "meta-llama/llama-3.3-70b-instruct:free"
  OPENROUTER_MODEL_PAID: "anthropic/claude-sonnet-4.5"
---
# Template only. `stringData` is committed with placeholders so the required
# keys are documented; the real Secret is created out of band and never lives
# in git.
#
#   kubectl -n horamind create secret generic horamind-secrets \
#     --from-literal=POSTGRES_USER=horamind \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 32)" \
#     --from-literal=POSTGRES_DB=horamind \
#     --from-literal=DATABASE_URL='postgres://horamind:PASSWORD@postgres:5432/horamind' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=OPENROUTER_API_KEY=sk-or-...
#
# For GitOps, seal this with sealed-secrets or SOPS rather than committing it.
apiVersion: v1
kind: Secret
metadata:
  name: horamind-secrets
  namespace: horamind
  annotations:
    horamind.dev/note: "Template. Replace before applying — do not commit real values."
type: Opaque
stringData:
  POSTGRES_USER: "horamind"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: "horamind"
  DATABASE_URL: "postgres://horamind:REPLACE_ME@postgres:5432/horamind"
  # openssl rand -base64 48 — the API refuses to start on anything shorter
  # than 32 characters, which is deliberate.
  JWT_SECRET: "REPLACE_ME_AT_LEAST_THIRTY_TWO_CHARACTERS_LONG"
  OPENROUTER_API_KEY: ""
  GOOGLE_CLIENT_ID_WEB: ""
  APPLE_BUNDLE_ID: ""

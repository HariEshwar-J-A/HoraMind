# Edge: Caddy routes one origin, cloudflared carries it to the internet.
#
# No Ingress and no LoadBalancer. The tunnel dials out, so the cluster needs no
# inbound port, no public IP and no certificate management — which on a home
# connection is the difference between a deployment and a security incident.
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: horamind
data:
  Caddyfile: |
    {
        # Never the public listener, so it must not try to obtain a
        # certificate — with no inbound route it could not answer an ACME
        # challenge and would retry forever.
        auto_https off
        admin off
        log {
            output stdout
            format json
        }
    }

    :80 {
        encode zstd gzip

        handle /api/* {
            uri strip_prefix /api
            reverse_proxy api:8080 {
                health_uri /health
                health_interval 30s
                # Chat streams token by token; buffering turns that into a
                # long silence followed by the whole reply at once.
                flush_interval -1
                header_up X-Real-IP {http.request.header.CF-Connecting-IP}
                header_up X-Forwarded-Proto https
            }
        }

        handle {
            root * /srv/web
            @immutable path /assets/*
            header @immutable Cache-Control "public, max-age=31536000, immutable"
            @volatile path /sw.js /manifest.webmanifest /index.html
            header @volatile Cache-Control "no-cache"
            try_files {path} /index.html
            file_server
        }

        header {
            X-Content-Type-Options "nosniff"
            Referrer-Policy "strict-origin-when-cross-origin"
            X-Frame-Options "DENY"
            -Server
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: horamind
  labels: { app: caddy }
spec:
  selector: { app: caddy }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: horamind
spec:
  replicas: 1
  selector:
    matchLabels: { app: caddy }
  template:
    metadata:
      labels: { app: caddy }
      annotations:
        # Restarts Caddy when the routing rules change; a ConfigMap update is
        # otherwise invisible to a running pod.
        checksum/config: "replace-on-change"
    spec:
      containers:
        - name: caddy
          image: caddy:2-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: web
              mountPath: /srv/web
              readOnly: true
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits:   { memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: caddy-config }
        - name: web
          # The built PWA. Populated by an init container or a CI artefact sync;
          # an empty volume serves 404s for the client while leaving the API
          # fully usable, which is the right failure mode.
          persistentVolumeClaim:
            claimName: web-assets
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-assets
  namespace: horamind
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: horamind
spec:
  replicas: 1
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          # --config is explicit on purpose. Without it cloudflared falls back
          # to ~/.cloudflared/config.yml, which on the host running another
          # tunnel belongs to that application — and this app's ingress rules
          # would be handed to it.
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yml
            - --no-autoupdate
            - run
          volumeMounts:
            - name: tunnel
              mountPath: /etc/cloudflared
              readOnly: true
          resources:
            requests: { memory: 32Mi, cpu: 20m }
            limits:   { memory: 128Mi }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: tunnel
          secret:
            # Created out of band from this app's own tunnel credentials:
            #   kubectl -n horamind create secret generic horamind-tunnel \
            #     --from-file=config.yml --from-file=creds.json
            secretName: horamind-tunnel

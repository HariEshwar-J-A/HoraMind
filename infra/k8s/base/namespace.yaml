apiVersion: v1
kind: Namespace
metadata:
  name: horamind
  labels:
    app.kubernetes.io/name: horamind
---
# Default-deny for ingress.
#
# Without this, any pod in the cluster can reach Postgres directly. On a single
# node running one application that sounds academic — right up until a second
# application shares the box, which is exactly the direction this cluster is
# expected to grow.
#
# Egress is deliberately left open: the API calls OpenRouter, and cloudflared
# dials out to Cloudflare's edge.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: horamind
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-api-only
  namespace: horamind
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        # The migration job and the backup job also need it, so the selector is
        # on a capability label rather than on the API by name.
        - podSelector:
            matchLabels: { needs-postgres: "true" }
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chroma-from-api-only
  namespace: horamind
spec:
  podSelector:
    matchLabels: { app: chroma }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: api }
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-edge-only
  namespace: horamind
spec:
  podSelector:
    matchLabels: { app: api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: caddy }
      ports:
        - port: 8080
          protocol: TCP
---
# Caddy's own ingress.
#
# Easy to forget, and fatal to omit: with default-deny in place and no policy
# naming Caddy, the tunnel cannot reach it and nothing is served at all — while
# every pod reports healthy, because each service is individually fine.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: caddy-from-tunnel-only
  namespace: horamind
spec:
  podSelector:
    matchLabels: { app: caddy }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: cloudflared }
      ports:
        - port: 80
          protocol: TCP
